<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D&V STORE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
}

header {
    background: #000;
    color: #fff;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header {
    max-width: 1100px;
    margin: auto;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #777;
}

.search {
    margin-top: 15px;
}

.search input {
    width: 100%;
    padding: 14px 16px;
    border: 0;
    outline: none;
    border-radius: 14px;
    background: #1c1c1e;
    color: #fff;
    font-size: 16px;
}

.search input::placeholder {
    color: #aaa;
}

.categories {
    max-width: 1100px;
    margin: auto;
    padding: 15px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
}

.categories button {
    border: 1px solid #ddd;
    background: #fff;
    padding: 10px 15px;
    border-radius: 12px;
    white-space: nowrap;
    font-weight: 600;
}

.categories button.active {
    background: #000;
    color: #fff;
}

.hero {
    max-width: 1100px;
    margin: 5px auto 25px;
    padding: 35px 22px;
    border-radius: 22px;
    background: linear-gradient(135deg,#050505,#333);
    color: white;
}

.hero small {
    color: #aaa;
}

.hero h1 {
    font-size: 34px;
    line-height: 1.05;
    margin: 10px 0;
}

.hero p {
    color: #ccc;
    margin-bottom: 20px;
}

.hero a {
    display: inline-block;
    background: #fff;
    color: #000;
    padding: 12px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
}

.section {
    max-width: 1100px;
    margin: auto;
    padding: 0 16px;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.title h2 {
    font-size: 23px;
}

.title span {
    color: #777;
    font-size: 13px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

.image {
    height: 190px;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
}

.info {
    padding: 12px;
}

.name {
    font-weight: 700;
    font-size: 15px;
    min-height: 36px;
}

.details {
    color: #777;
    font-size: 12px;
    margin-top: 7px;
    line-height: 1.5;
    min-height: 30px;
}

.price {
    font-size: 19px;
    font-weight: 800;
    margin-top: 10px;
}

.stock {
    color: #16a34a;
    font-size: 12px;
    font-weight: 600;
    margin-top: 5px;
}

.more {
    display: block;
    text-align: center;
    background: #000;
    color: #fff;
    text-decoration: none;
    padding: 11px;
    border-radius: 11px;
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
}

.empty {
    display: none;
    text-align: center;
    padding: 50px 10px;
    color: #777;
}

footer {
    background: #000;
    color: #fff;
    margin-top: 35px;
    padding: 30px 16px;
}

.footer {
    max-width: 1100px;
    margin: auto;
}

.footer-logo {
    font-size: 22px;
    font-weight: 800;
}

footer p {
    color: #aaa;
    margin-top: 10px;
    font-size: 13px;
}

.telegram {
    display: inline-block;
    margin-top: 18px;
    background: #229ED9;
    color: #fff;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
}

@media (min-width:700px) {
    .products {
        grid-template-columns: repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="logo">
            D<span>&</span>V STORE
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                placeholder="🔎 Найти смартфон..."
            >
        </div>

    </div>
</header>

<div class="categories">

    <button class="active" data-brand="Все">Все</button>

    <button data-brand="Apple">🍎 Apple</button>

    <button data-brand="Samsung">Samsung</button>

    <button data-brand="Xiaomi">Xiaomi</button>

</div>

<section class="hero">

    <small>D&V STORE</small>

    <h1>
        Техника,<br>
        которую хочется.
    </h1>

    <p>
        Смартфоны и техника по выгодным ценам.
    </p>

    <a href="#catalog">
        Смотреть каталог
    </a>

</section>

<section class="section" id="catalog">

    <div class="title">
        <h2>Популярное</h2>
        <span id="count"></span>
    </div>

    <div class="products" id="products"></div>

    <div class="empty" id="empty">
        😔<br><br>
        Ничего не найдено
    </div>

</section>

<footer>

    <div class="footer">

        <div class="footer-logo">
            D&V STORE
        </div>

        <p>
            Магазин современной техники.
        </p>

        <a
            class="telegram"
            href="https://t.me/"
            target="_blank"
        >
            ✈️ Telegram
        </a>

    </div>

</footer>

<script>

const products = [

    {
        name: "Apple iPhone 17 Pro Max",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "глубокий синий",
        image: "https://store77.net:443/upload/iblock/175/c9pexu0t4qtzopumdsjgc6jvlkryd6sj.jpg",
        url: "https://store77.net/apple_iphone_17_pro_max_1/"
    },

    {
        name: "Apple iPhone 17 Pro",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "космический оранжевый",
        image: "https://store77.net:443/upload/iblock/85d/pj1n8t86c1zc0zu0ri62j5wzblrqkqhu.jpg",
        url: "https://store77.net/apple_iphone_17_pro_1/"
    },

    {
        name: "Apple iPhone 17",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "черный",
        image: "https://store77.net/upload/iblock/f7f/jsbdg8u104tqv2hx3e67742f110k7ij0.jpg",
        url: "https://store77.net/apple_iphone_17_/"
    },

    {
        name: "Apple iPhone 17e",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/apple_iphone_17e/"
    },

    {
        name: "Apple iPhone Air",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/apple_iphone_air/"
    },

    {
        name: "Apple iPhone 16 Pro Max",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/apple_iphone_16_pro_max_2/"
    },

    {
        name: "Apple iPhone 16 Pro",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/apple_iphone_16_pro_2/"
    },

    {
        name: "Samsung Galaxy S26 Ultra",
        price: "Цена уточняется",
        brand: "Samsung",
        memory: "",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/samsung_galaxy_s26_ultra_2/"
    },

    {
        name: "Xiaomi 17 Ultra",
        price: "Цена уточняется",
        brand: "Xiaomi",
        memory: "",
        color: "",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png",
        url: "https://store77.net/xiaomi_17_ultra/"
    }

];


const productsBox = document.getElementById("products");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const search = document.getElementById("search");

let selectedBrand = "Все";


function showProducts() {

    const query = search.value.toLowerCase().trim();

    const filtered = products.filter(product => {

        const text = (
            product.name +
            " " +
            product.brand +
            " " +
            product.memory +
            " " +
            product.color
        ).toLowerCase();

        const searchOK = text.includes(query);

        const brandOK =
            selectedBrand === "Все" ||
            product.brand === selectedBrand;

        return searchOK && brandOK;

    });


    productsBox.innerHTML = "";

    count.textContent = filtered.length + " товаров";


    if (filtered.length === 0) {

        empty.style.display = "block";

        return;
    }


    empty.style.display = "none";


    filtered.forEach(product => {

        const card = document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <div class="image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.src='https://store77.net/bitrix/templates/v11/img/og-default.png'"
                >

            </div>

            <div class="info">

                <div class="name">
                    ${product.name}
                </div>

                <div class="details">

                    ${product.memory
                        ? "Память: " + product.memory
                        : ""
                    }

                    ${product.color
                        ? "<br>Цвет: " + product.color
                        : ""
                    }

                </div>

                <div class="price">
                    ${product.price}
                </div>

                <div class="stock">
                    ● В наличии
                </div>

                <a
                    class="more"
                    href="${product.url}"
                    target="_blank"
                >
                    Подробнее
                </a>

            </div>
        `;


        productsBox.appendChild(card);

    });

}


document.querySelectorAll(".categories button").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".categories button")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        selectedBrand = button.dataset.brand;

        showProducts();

    });

});


search.addEventListener("input", showProducts);


showProducts();

</script>

</body>
</html>
