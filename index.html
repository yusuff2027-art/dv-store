<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D&V STORE — Магазин техники</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
}

/* HEADER */

.header {
    background: #000;
    color: #fff;
    padding: 18px 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #888;
}

.cart {
    font-size: 24px;
}

/* SEARCH */

.search {
    margin-top: 16px;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    background: #1c1c1e;
    color: white;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 16px;
}

.search input::placeholder {
    color: #999;
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding: 16px;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 10px 15px;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.category.active {
    background: #000;
    color: white;
}

/* HERO */

.hero {
    margin: 0 16px 22px;
    padding: 28px 22px;
    border-radius: 22px;
    background: linear-gradient(135deg, #111, #333);
    color: white;
    overflow: hidden;
}

.hero small {
    color: #aaa;
    font-size: 13px;
}

.hero h1 {
    font-size: 30px;
    line-height: 1.05;
    margin: 8px 0;
}

.hero p {
    color: #ccc;
    font-size: 14px;
    margin-bottom: 18px;
}

.hero-button {
    display: inline-block;
    background: white;
    color: black;
    padding: 11px 17px;
    border-radius: 12px;
    font-weight: 700;
    text-decoration: none;
}

/* SECTION */

.section {
    padding: 0 16px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.section-title h2 {
    font-size: 22px;
}

.section-title span {
    font-size: 13px;
    color: #777;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: 30px;
}

.product {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
}

.product-info {
    padding: 12px;
}

.product-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    min-height: 36px;
}

.product-details {
    margin-top: 7px;
    color: #777;
    font-size: 12px;
    line-height: 1.4;
    min-height: 32px;
}

.product-price {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 800;
}

.available {
    margin-top: 5px;
    color: #16a34a;
    font-size: 12px;
    font-weight: 600;
}

.product-button {
    display: block;
    text-align: center;
    margin-top: 10px;
    background: #000;
    color: white;
    text-decoration: none;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
}

/* EMPTY */

.empty {
    display: none;
    text-align: center;
    padding: 40px 10px;
    color: #777;
}

/* FOOTER */

.footer {
    background: #000;
    color: white;
    padding: 30px 16px;
    margin-top: 20px;
}

.footer-logo {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 10px;
}

.footer p {
    color: #aaa;
    font-size: 13px;
    line-height: 1.5;
}

.telegram {
    display: inline-block;
    margin-top: 18px;
    background: #229ED9;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
}

/* DESKTOP */

@media (min-width: 700px) {

    .header {
        padding-left: calc((100% - 1100px) / 2);
        padding-right: calc((100% - 1100px) / 2);
    }

    .categories,
    .hero,
    .section {
        max-width: 1100px;
        margin-left: auto;
        margin-right: auto;
    }

    .products {
        grid-template-columns: repeat(4, 1fr);
    }

    .hero {
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="header-top">
        <div class="logo">
            D<span>&</span>V STORE
        </div>

        <div class="cart">
            🛒
        </div>
    </div>

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="🔎 Найти товар..."
            oninput="searchProducts()"
        >
    </div>

</header>


<!-- CATEGORIES -->

<div class="categories">

    <button class="category active" onclick="filterProducts('all', this)">
        Все
    </button>

    <button class="category" onclick="filterProducts('Apple', this)">
        🍎 Apple
    </button>

    <button class="category" onclick="filterProducts('Samsung', this)">
        Samsung
    </button>

    <button class="category" onclick="filterProducts('Xiaomi', this)">
        Xiaomi
    </button>

    <button class="category" onclick="filterProducts('Наушники', this)">
        🎧 Наушники
    </button>

</div>


<!-- HERO -->

<section class="hero">

    <small>D&V STORE</small>

    <h1>
        Техника,<br>
        которую хочется.
    </h1>

    <p>
        Смартфоны, Apple, Samsung,
        Xiaomi и аксессуары.
    </p>

    <a href="#products" class="hero-button">
        Смотреть товары
    </a>

</section>


<!-- PRODUCTS -->

<section class="section">

    <div class="section-title">
        <h2>Популярное</h2>
        <span id="count"></span>
    </div>

    <div id="products" class="products"></div>

    <div id="empty" class="empty">
        😔<br><br>
        Ничего не нашли
    </div>

</section>


<!-- FOOTER -->

<footer class="footer">

    <div class="footer-logo">
        D&V STORE
    </div>

    <p>
        Магазин современной техники.
        Выбирай. Сравнивай. Покупай.
    </p>

    <a
        class="telegram"
        href="https://t.me/"
        target="_blank"
    >
        ✈️ Наш Telegram
    </a>

</footer>


<script>

/* =========================
   ТОВАРЫ
========================= */

const products = [

    {
        name: "Apple iPhone 17 Pro Max",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "глубокий синий",
        available: true,
        url: "https://store77.net/apple_iphone_17_pro_max_1/",
        image: "https://store77.net:443/upload/iblock/175/c9pexu0t4qtzopumdsjgc6jvlkryd6sj.jpg"
    },

    {
        name: "Apple iPhone 17 Pro",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "космический оранжевый",
        available: true,
        url: "https://store77.net/apple_iphone_17_pro_1/",
        image: "https://store77.net:443/upload/iblock/85d/pj1n8t86c1zc0zu0ri62j5wzblrqkqhu.jpg"
    },

    {
        name: "Apple iPhone 17",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "черный",
        available: true,
        url: "https://store77.net/apple_iphone_17_/",
        image: "https://store77.net/upload/iblock/f7f/jsbdg8u104tqv2hx3e67742f110k7ij0.jpg"
    },

    {
        name: "Apple iPhone 17e",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        available: true,
        url: "https://store77.net/apple_iphone_17e/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    },

    {
        name: "Apple iPhone Air",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        available: true,
        url: "https://store77.net/apple_iphone_air/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    },

    {
        name: "Apple iPhone 16 Pro Max",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        available: true,
        url: "https://store77.net/apple_iphone_16_pro_max_2/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    },

    {
        name: "Apple iPhone 16 Pro",
        price: "77 Р",
        brand: "Apple",
        memory: "256 ГБ",
        color: "",
        available: true,
        url: "https://store77.net/apple_iphone_16_pro_2/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    },

    {
        name: "Samsung Galaxy S26 Ultra",
        price: "Уточнить",
        brand: "Samsung",
        memory: "",
        color: "",
        available: true,
        url: "https://store77.net/samsung_galaxy_s26_ultra_2/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    },

    {
        name: "Xiaomi 17 Ultra",
        price: "Уточнить",
        brand: "Xiaomi",
        memory: "",
        color: "",
        available: true,
        url: "https://store77.net/xiaomi_17_ultra/",
        image: "https://store77.net/bitrix/templates/v11/img/og-default.png"
    }

];


/* =========================
   ОТОБРАЖЕНИЕ
========================= */

let currentFilter = "all";

function renderProducts(list) {

    const container = document.getElementById("products");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    container.innerHTML = "";

    count.textContent = list.length + " товаров";

    if (list.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    list.forEach(product => {

        const card = document.createElement("article");

        card.className = "product";

        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                    onerror="this.src='https://store77.net/bitrix/templates/v11/img/og-default.png'"
                >

            </div>

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-details">

                    ${product.memory
                        ? "Память: " + product.memory
                        : ""
                    }

                    ${product.color
                        ? "<br>Цвет: " + product.color
                        : ""
                    }

                </div>

                <div class="product-price">
                    ${product.price}
                </div>

                <div class="available">

                    ● ${product.available
                        ? "В наличии"
                        : "Нет в наличии"
                    }

                </div>

                <a
                    class="product-button"
                    href="${product.url}"
                    target="_blank"
                >
                    Подробнее
                </a>

            </div>

        `;

        container.appendChild(card);

    });
}


/* =========================
   ФИЛЬТР
========================= */

function filterProducts(filter, button) {

    currentFilter = filter;

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    applyFilters();
}


/* =========================
   ПОИСК
========================= */

function searchProducts() {
    applyFilters();
}


function applyFilters() {

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    let result = products.filter(product => {

        const text = (
            product.name +
            " " +
            product.brand +
            " " +
            product.memory +
            " " +
            product.color
        ).toLowerCase();

        const matchesSearch =
            text.includes(query);

        const matchesCategory =
            currentFilter === "all" ||
            product.brand === currentFilter;

        return matchesSearch && matchesCategory;

    });

    renderProducts(result);
}


/* =========================
   START
========================= */

renderProducts(products);

</script>

</body>
</html>
