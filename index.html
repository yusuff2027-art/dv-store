<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>D&V STORE — техника</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f5f5f7;
    color: #111;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(17,17,17,.96);

    backdrop-filter: blur(15px);

    color: white;

    padding: 16px 20px;
}

.header-inner {
    max-width: 1250px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 25px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    white-space: nowrap;
}

.logo span {
    color: #ff7900;
}

.search {
    flex: 1;
}

.search input {
    width: 100%;

    padding: 14px 20px;

    border: none;
    outline: none;

    border-radius: 30px;

    font-size: 16px;
}

.container {
    max-width: 1250px;

    margin: auto;

    padding: 25px 20px;
}

.hero {
    background:
        linear-gradient(
            135deg,
            #111,
            #292929
        );

    color: white;

    border-radius: 25px;

    padding: 40px 30px;

    margin-bottom: 25px;
}

.hero h1 {
    font-size: 42px;

    margin-bottom: 10px;
}

.hero p {
    color: #cfcfcf;

    font-size: 17px;
}

.stats {
    margin-top: 20px;

    display: flex;
    gap: 12px;

    flex-wrap: wrap;
}

.stat {
    background: rgba(255,255,255,.08);

    border: 1px solid
        rgba(255,255,255,.1);

    border-radius: 12px;

    padding: 10px 14px;

    font-size: 14px;
}

.categories {
    display: flex;

    gap: 10px;

    overflow-x: auto;

    padding-bottom: 15px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex-shrink: 0;

    border: 1px solid #ddd;

    background: white;

    border-radius: 25px;

    padding: 11px 18px;

    cursor: pointer;

    font-size: 14px;

    transition: .2s;
}

.category:hover,
.category.active {
    background: #111;

    color: white;

    border-color: #111;
}

.products {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;
}

.product {
    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);

    transition: .25s;
}

.product:hover {
    transform:
        translateY(-5px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.12);
}

.product-image {
    height: 245px;

    background: #fafafa;

    padding: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}

.product-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    transition: .2s;
}

.product:hover
.product-image img {
    transform: scale(1.04);
}

.no-image {
    color: #aaa;

    text-align: center;

    font-size: 14px;
}

.product-info {
    padding: 16px;
}

.product-name {
    font-size: 16px;

    font-weight: 750;

    line-height: 1.3;

    min-height: 42px;
}

.product-meta {
    color: #777;

    font-size: 13px;

    margin-top: 8px;

    min-height: 18px;
}

.price {
    font-size: 22px;

    font-weight: 900;

    margin-top: 13px;
}

.stock {
    margin-top: 6px;

    font-size: 13px;

    color: #159447;
}

.out {
    color: #d33;
}

.details {
    width: 100%;

    border: none;

    background: #111;

    color: white;

    padding: 13px;

    border-radius: 11px;

    margin-top: 14px;

    cursor: pointer;

    font-weight: 700;

    font-size: 14px;

    transition: .2s;
}

.details:hover {
    background: #ff7900;
}

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #777;
}

.loader {
    grid-column: 1 / -1;

    text-align: center;

    padding: 70px;

    color: #777;
}

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        rgba(0,0,0,.75);

    padding: 20px;

    overflow-y: auto;
}

.modal.active {
    display: flex;

    align-items: center;

    justify-content: center;
}

.modal-box {
    width: 100%;

    max-width: 900px;

    background: white;

    border-radius: 25px;

    padding: 25px;

    position: relative;

    max-height: 95vh;

    overflow-y: auto;
}

.close {
    position: absolute;

    right: 20px;
    top: 12px;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #eee;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 28px;

    cursor: pointer;

    z-index: 5;
}

.modal-content {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 30px;
}

.modal-image {
    height: 450px;

    background: #f7f7f7;

    border-radius: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.modal-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.modal-title {
    font-size: 30px;

    font-weight: 900;

    line-height: 1.15;

    padding-right: 40px;
}

.modal-price {
    font-size: 31px;

    font-weight: 900;

    margin: 20px 0;
}

.modal-row {
    padding: 13px 0;

    border-bottom:
        1px solid #eee;
}

.modal-label {
    color: #888;

    font-size: 13px;

    margin-bottom: 3px;
}

.modal-value {
    font-weight: 600;
}

.source-note {
    margin-top: 20px;

    padding: 12px;

    background: #f5f5f7;

    border-radius: 10px;

    color: #777;

    font-size: 12px;
}

footer {
    margin-top: 60px;

    background: #111;

    color: #999;

    text-align: center;

    padding: 30px 20px;
}

@media (max-width: 1050px) {

    .products {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 750px) {

    .header-inner {
        flex-direction: column;

        gap: 12px;
    }

    .logo {
        text-align: center;
    }

    .products {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .product-image {
        height: 190px;
    }

    .product-info {
        padding: 12px;
    }

    .product-name {
        font-size: 14px;
    }

    .price {
        font-size: 18px;
    }

    .hero {
        padding: 30px 20px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .modal-content {
        grid-template-columns: 1fr;
    }

    .modal-image {
        height: 300px;
    }

    .modal-title {
        font-size: 25px;
    }

}

@media (max-width: 430px) {

    .container {
        padding:
            15px 10px;
    }

    .products {
        gap: 9px;
    }

    .product-image {
        height: 155px;

        padding: 10px;
    }

    .product-info {
        padding: 10px;
    }

    .details {
        padding: 11px 5px;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            D&V <span>STORE</span>
        </div>

        <div class="search">

            <input
                id="search"
                type="text"
                placeholder="🔎 Найти iPhone, Samsung, Xiaomi..."
            >

        </div>

    </div>

</header>


<main class="container">

    <section class="hero">

        <h1>D&V STORE</h1>

        <p>
            Техника и электроника
        </p>

        <div class="stats">

            <div class="stat">
                📦 <span id="productCount">0</span> товаров
            </div>

            <div class="stat">
                🔄 Каталог обновляется
            </div>

        </div>

    </section>


    <div
        class="categories"
        id="categories"
    >

        <button
            class="category active"
            data-category="all"
        >
            Все
        </button>

        <button
            class="category"
            data-category="Apple"
        >
            🍎 Apple
        </button>

        <button
            class="category"
            data-category="Samsung"
        >
            Samsung
        </button>

        <button
            class="category"
            data-category="Xiaomi"
        >
            Xiaomi
        </button>

        <button
            class="category"
            data-category="Honor"
        >
            Honor
        </button>

        <button
            class="category"
            data-category="Google"
        >
            Google
        </button>

        <button
            class="category"
            data-category="OnePlus"
        >
            OnePlus
        </button>

        <button
            class="category"
            data-category="Huawei"
        >
            Huawei
        </button>

        <button
            class="category"
            data-category="Nothing"
        >
            Nothing
        </button>

    </div>


    <section
        class="products"
        id="products"
    >

        <div class="loader">
            Загружаем каталог...
        </div>

    </section>

</main>


<footer>

    © 2026 D&V STORE

</footer>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <div
            class="close"
            id="closeModal"
        >
            ×
        </div>

        <div class="modal-content">

            <div class="modal-image">

                <img
                    id="modalImage"
                    src=""
                    alt=""
                >

            </div>


            <div>

                <div
                    class="modal-title"
                    id="modalName"
                ></div>

                <div
                    class="modal-price"
                    id="modalPrice"
                ></div>


                <div class="modal-row">

                    <div class="modal-label">
                        Бренд
                    </div>

                    <div
                        class="modal-value"
                        id="modalBrand"
                    ></div>

                </div>


                <div class="modal-row">

                    <div class="modal-label">
                        Память
                    </div>

                    <div
                        class="modal-value"
                        id="modalMemory"
                    ></div>

                </div>


                <div class="modal-row">

                    <div class="modal-label">
                        Цвет
                    </div>

                    <div
                        class="modal-value"
                        id="modalColor"
                    ></div>

                </div>


                <div class="modal-row">

                    <div class="modal-label">
                        Наличие
                    </div>

                    <div
                        class="modal-value"
                        id="modalAvailable"
                    ></div>

                </div>


                <div class="source-note">

                    Цена и наличие обновляются
                    автоматически.

                </div>

            </div>

        </div>

    </div>

</div>


<script>

let products = [];

let currentCategory = "all";


const productsContainer =
    document.getElementById(
        "products"
    );

const searchInput =
    document.getElementById(
        "search"
    );

const modal =
    document.getElementById(
        "modal"
    );


function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


async function loadProducts() {

    try {

        const response =
            await fetch(
                "products.json?t="
                + Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "products.json не найден"
            );
        }

        products =
            await response.json();

        document.getElementById(
            "productCount"
        ).textContent =
            products.length;

        renderProducts();

    } catch (error) {

        console.error(error);

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Не удалось загрузить каталог
                </h2>

                <p>
                    Проверь файл products.json
                </p>

            </div>

        `;

    }

}


function renderProducts() {

    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const filtered =
        products.filter(product => {

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const brand =
                String(
                    product.brand || ""
                ).toLowerCase();

            const category =
                String(
                    product.category || ""
                ).toLowerCase();


            const matchesSearch =
                !search
                ||
                name.includes(search)
                ||
                brand.includes(search)
                ||
                category.includes(search);


            const matchesCategory =
                currentCategory === "all"
                ||
                category ===
                currentCategory.toLowerCase();


            return (
                matchesSearch
                &&
                matchesCategory
            );

        });


    if (!filtered.length) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Ничего не найдено
                </h2>

                <p>
                    Попробуй изменить запрос
                </p>

            </div>

        `;

        return;

    }


    productsContainer.innerHTML =
        filtered.map(
            product => {

                const image =
                    product.image || "";


                const imageHTML =
                    image

                    ?

                    `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML='<div class=&quot;no-image&quot;>Фото пока нет</div>';
                        "
                    >
                    `

                    :

                    `
                    <div class="no-image">
                        Фото пока нет
                    </div>
                    `;


                const meta =
                    [
                        product.memory,
                        product.color
                    ]
                    .filter(Boolean)
                    .map(escapeHtml)
                    .join(" · ");


                const stock =
                    product.available

                    ?

                    `
                    <div class="stock">
                        ● В наличии
                    </div>
                    `

                    :

                    `
                    <div class="stock out">
                        ● Нет в наличии
                    </div>
                    `;


                return `

                    <article class="product">

                        <div class="product-image">

                            ${imageHTML}

                        </div>


                        <div class="product-info">

                            <div class="product-name">

                                ${escapeHtml(
                                    product.name
                                    ||
                                    "Товар"
                                )}

                            </div>


                            <div class="product-meta">

                                ${meta}

                            </div>


                            <div class="price">

                                ${escapeHtml(
                                    product.price
                                    ||
                                    "Цена уточняется"
                                )}

                            </div>


                            ${stock}


                            <button
                                class="details"
                                onclick="openProduct('${escapeHtml(product.id)}')"
                            >
                                Подробнее
                            </button>

                        </div>

                    </article>

                `;

            }
        ).join("");

}


function openProduct(id) {

    const product =
        products.find(
            item =>
                String(item.id)
                === String(id)
        );


    if (!product) {
        return;
    }


    document.getElementById(
        "modalImage"
    ).src =
        product.image || "";


    document.getElementById(
        "modalName"
    ).textContent =
        product.name
        ||
        "Товар";


    document.getElementById(
        "modalPrice"
    ).textContent =
        product.price
        ||
        "Цена уточняется";


    document.getElementById(
        "modalBrand"
    ).textContent =
        product.brand
        ||
        "—";


    document.getElementById(
        "modalMemory"
    ).textContent =
        product.memory
        ||
        "—";


    document.getElementById(
        "modalColor"
    ).textContent =
        product.color
        ||
        "—";


    document.getElementById(
        "modalAvailable"
    ).textContent =
        product.available
        ?
        "В наличии"
        :
        "Нет в наличии";


    modal.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}


function closeModal() {

    modal.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}


document.getElementById(
    "closeModal"
).addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {
            closeModal();
        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {
            closeModal();
        }

    }
);


searchInput.addEventListener(
    "input",
    renderProducts
);


document
    .querySelectorAll(
        ".category"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                currentCategory =
                    button.dataset.category;


                renderProducts();

            }
        );

    });


loadProducts();

</script>

</body>

</html>
