<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D&V STORE — техника и электроника</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    color: #111;
}

header {
    background: #111;
    color: #fff;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 25px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    white-space: nowrap;
}

.logo span {
    color: #ff7900;
}

.search {
    flex: 1;
}

.search input {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    outline: none;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 22px 20px;
}

.hero {
    background: linear-gradient(135deg, #111, #292929);
    color: #fff;
    border-radius: 24px;
    padding: 40px 28px;
    margin-bottom: 22px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero p {
    color: #ccc;
    font-size: 16px;
}

.catalog-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 15px;
}

.catalog-count {
    color: #777;
    font-size: 14px;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.category {
    flex-shrink: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 30px;
    padding: 10px 17px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
}

.category:hover,
.category.active {
    background: #111;
    color: #fff;
    border-color: #111;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
    transition: .25s;
}

.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,.13);
}

.product-image {
    height: 240px;
    background: #fafafa;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.product-info {
    padding: 16px;
}

.product-name {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    min-height: 42px;
}

.product-meta {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
}

.price {
    font-size: 21px;
    font-weight: 900;
    margin-top: 12px;
}

.stock {
    color: #159447;
    font-size: 13px;
    margin-top: 6px;
}

.details {
    width: 100%;
    border: none;
    background: #111;
    color: #fff;
    padding: 13px;
    border-radius: 10px;
    margin-top: 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    transition: .2s;
}

.details:hover {
    background: #ff7900;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: #777;
}

.loader {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: #777;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: 100%;
    max-width: 900px;
    background: #fff;
    border-radius: 25px;
    padding: 25px;
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 13px;
    font-size: 32px;
    cursor: pointer;
    z-index: 5;
}

.modal-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.modal-image {
    height: 430px;
    background: #f7f7f7;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.modal-title {
    font-size: 29px;
    font-weight: 900;
    padding-right: 30px;
    margin-bottom: 15px;
}

.modal-price {
    font-size: 30px;
    font-weight: 900;
    margin: 20px 0;
}

.modal-row {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.modal-label {
    color: #777;
    font-size: 13px;
    margin-bottom: 4px;
}

.modal-value {
    font-weight: 700;
}

footer {
    margin-top: 50px;
    background: #111;
    color: #aaa;
    padding: 30px 20px;
    text-align: center;
}

@media (max-width: 1000px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {

    .header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }

    .logo {
        text-align: center;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product-image {
        height: 180px;
    }

    .product-info {
        padding: 12px;
    }

    .product-name {
        font-size: 14px;
    }

    .price {
        font-size: 18px;
    }

    .hero {
        padding: 30px 20px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .modal-content {
        grid-template-columns: 1fr;
    }

    .modal-image {
        height: 300px;
    }

    .modal-title {
        font-size: 24px;
    }
}

@media (max-width: 430px) {

    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    .product-image {
        height: 145px;
    }

    .details {
        padding: 11px 5px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            D&V <span>STORE</span>
        </div>

        <div class="search">
            <input
                id="search"
                type="search"
                placeholder="🔎 Найти товар..."
                autocomplete="off"
            >
        </div>

    </div>

</header>

<main class="container">

    <section class="hero">

        <h1>D&V STORE</h1>

        <p>
            Техника и электроника по актуальным ценам
        </p>

    </section>

    <div class="categories">

        <button class="category active" data-category="all">
            Все товары
        </button>

        <button class="category" data-category="Apple">
            🍎 Apple
        </button>

        <button class="category" data-category="Samsung">
            Samsung
        </button>

        <button class="category" data-category="Xiaomi">
            Xiaomi
        </button>

        <button class="category" data-category="Huawei">
            Huawei
        </button>

        <button class="category" data-category="Google">
            Google
        </button>

        <button class="category" data-category="OnePlus">
            OnePlus
        </button>

        <button class="category" data-category="Poco">
            Poco
        </button>

        <button class="category" data-category="Honor">
            Honor
        </button>

        <button class="category" data-category="Nothing">
            Nothing
        </button>

    </div>

    <div class="catalog-info">

        <div class="catalog-count" id="catalogCount">
            Загрузка каталога...
        </div>

    </div>

    <section class="products" id="products">

        <div class="loader">
            Загружаем каталог...
        </div>

    </section>

</main>

<footer>

    © 2026 D&V STORE

</footer>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="close" onclick="closeModal()">×</div>

        <div class="modal-content">

            <div class="modal-image">

                <img
                    id="modalImage"
                    src=""
                    alt=""
                >

            </div>

            <div>

                <div
                    class="modal-title"
                    id="modalName">
                </div>

                <div
                    class="modal-price"
                    id="modalPrice">
                </div>

                <div class="modal-row">

                    <div class="modal-label">
                        Бренд
                    </div>

                    <div
                        class="modal-value"
                        id="modalBrand">
                    </div>

                </div>

                <div class="modal-row">

                    <div class="modal-label">
                        Память
                    </div>

                    <div
                        class="modal-value"
                        id="modalMemory">
                    </div>

                </div>

                <div class="modal-row">

                    <div class="modal-label">
                        Цвет
                    </div>

                    <div
                        class="modal-value"
                        id="modalColor">
                    </div>

                </div>

                <div class="modal-row">

                    <div class="modal-label">
                        Наличие
                    </div>

                    <div
                        class="modal-value"
                        id="modalAvailable">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

let products = [];

let currentCategory = "all";

const productsContainer =
    document.getElementById("products");

const searchInput =
    document.getElementById("search");

const catalogCount =
    document.getElementById("catalogCount");

const fallbackImage =
    "https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=800&q=80";


/* ============================
   ЗАГРУЗКА
============================ */

async function loadProducts() {

    try {

        const response =
            await fetch(
                "products.json?t=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "products.json не найден"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "products.json должен содержать массив"
            );
        }

        products = data;

        renderProducts();

    } catch (error) {

        console.error(error);

        catalogCount.textContent =
            "Ошибка загрузки каталога";

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Не удалось загрузить каталог
                </h2>

                <p>
                    Проверь, что файл
                    <b>products.json</b>
                    находится рядом с
                    <b>index.html</b>.
                </p>

            </div>

        `;
    }
}


/* ============================
   КАРТОЧКИ
============================ */

function renderProducts() {

    const search =
        searchInput.value
        .toLowerCase()
        .trim();

    const filtered =
        products.filter(product => {

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const brand =
                String(
                    product.brand || ""
                ).toLowerCase();

            const memory =
                String(
                    product.memory || ""
                ).toLowerCase();

            const color =
                String(
                    product.color || ""
                ).toLowerCase();

            const category =
                String(
                    product.category ||
                    product.brand ||
                    ""
                ).toLowerCase();

            const matchesSearch =
                name.includes(search) ||
                brand.includes(search) ||
                memory.includes(search) ||
                color.includes(search);

            const matchesCategory =
                currentCategory === "all" ||
                category ===
                currentCategory.toLowerCase();

            return (
                matchesSearch &&
                matchesCategory
            );

        });


    catalogCount.textContent =
        "Товаров: " + filtered.length;


    if (!filtered.length) {

        productsContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Ничего не найдено
                </h2>

                <p>
                    Попробуй изменить запрос
                </p>

            </div>

        `;

        return;
    }


    productsContainer.innerHTML =
        filtered.map(product => {

            const index =
                products.indexOf(product);

            const image =
                product.image ||
                fallbackImage;

            const meta = [
                product.memory,
                product.color
            ]
            .filter(Boolean)
            .join(" · ");


            return `

                <article class="product">

                    <div class="product-image">

                        <img
                            src="${escapeAttr(image)}"
                            alt="${escapeAttr(product.name || "Товар")}"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='${fallbackImage}'"
                        >

                    </div>

                    <div class="product-info">

                        <div class="product-name">

                            ${escapeHtml(
                                product.name ||
                                "Товар"
                            )}

                        </div>

                        <div class="product-meta">

                            ${escapeHtml(meta)}

                        </div>

                        <div class="price">

                            ${escapeHtml(
                                product.price ||
                                "Цена уточняется"
                            )}

                        </div>

                        <div class="stock">

                            ${
                                product.available
                                ? "● В наличии"
                                : "● Нет в наличии"
                            }

                        </div>

                        <button
                            class="details"
                            onclick="openProduct(${index})"
                        >
                            Подробнее
                        </button>

                    </div>

                </article>

            `;

        }).join("");
}


/* ============================
   ТОВАР
============================ */

function openProduct(index) {

    const product =
        products[index];

    if (!product) return;


    const modalImage =
        document.getElementById(
            "modalImage"
        );


    modalImage.src =
        product.image ||
        fallbackImage;

    modalImage.onerror =
        function() {

            this.onerror = null;

            this.src =
                fallbackImage;

        };


    document.getElementById(
        "modalName"
    ).textContent =
        product.name || "Товар";


    document.getElementById(
        "modalPrice"
    ).textContent =
        product.price ||
        "Цена уточняется";


    document.getElementById(
        "modalBrand"
    ).textContent =
        product.brand || "—";


    document.getElementById(
        "modalMemory"
    ).textContent =
        product.memory || "—";


    document.getElementById(
        "modalColor"
    ).textContent =
        product.color || "—";


    document.getElementById(
        "modalAvailable"
    ).textContent =
        product.available
        ? "В наличии"
        : "Нет в наличии";


    document
        .getElementById("modal")
        .classList.add("active");
}


function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");

}


/* Закрытие по фону */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                closeModal();
            }

        }
    );


/* ESC */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {
            closeModal();
        }

    }
);


/* ============================
   ПОИСК
============================ */

searchInput.addEventListener(
    "input",
    renderProducts
);


/* ============================
   КАТЕГОРИИ
============================ */

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(
                        ".category"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                this.classList.add(
                    "active"
                );

                currentCategory =
                    this.dataset.category;

                renderProducts();

            }
        );

    });


/* ============================
   БЕЗОПАСНЫЙ HTML
============================ */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(value) {

    return escapeHtml(value);

}


/* ============================
   START
============================ */

loadProducts();

</script>

</body>
</html>
