<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D&V STORE — магазин техники</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #ff7a00;
}

.search {
    flex: 1;
    max-width: 500px;
}

.search input {
    width: 100%;
    padding: 13px 18px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    outline: none;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.hero {
    background: linear-gradient(135deg, #111, #292929);
    color: white;
    border-radius: 22px;
    padding: 35px 25px;
    margin-bottom: 22px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.hero p {
    color: #ccc;
    font-size: 16px;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 15px;
    margin-bottom: 10px;
}

.category {
    flex-shrink: 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 10px 17px;
    cursor: pointer;
    transition: .2s;
}

.category:hover,
.category.active {
    background: #111;
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
    transition: .25s;
}

.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
}

.product-image {
    height: 230px;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.product-info {
    padding: 16px;
}

.product-name {
    font-size: 17px;
    font-weight: 700;
    min-height: 44px;
}

.product-meta {
    color: #777;
    font-size: 14px;
    margin-top: 8px;
}

.price {
    font-size: 22px;
    font-weight: 900;
    margin-top: 12px;
}

.stock {
    color: #159447;
    font-size: 13px;
    margin-top: 6px;
}

.details {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 13px;
    border-radius: 10px;
    margin-top: 14px;
    cursor: pointer;
    font-weight: 700;
}

.details:hover {
    background: #ff7a00;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: 100%;
    max-width: 850px;
    background: white;
    border-radius: 24px;
    padding: 25px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 15px;
    font-size: 28px;
    cursor: pointer;
}

.modal-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.modal-image {
    height: 400px;
    background: #f6f6f6;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.modal-title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 15px;
}

.modal-price {
    font-size: 30px;
    font-weight: 900;
    margin: 20px 0;
}

.modal-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.modal-label {
    color: #777;
}

footer {
    margin-top: 50px;
    background: #111;
    color: #aaa;
    padding: 30px 20px;
    text-align: center;
}

@media (max-width: 1000px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {

    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }

    .logo {
        text-align: center;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product-image {
        height: 180px;
    }

    .product-info {
        padding: 12px;
    }

    .product-name {
        font-size: 15px;
    }

    .price {
        font-size: 18px;
    }

    .hero h1 {
        font-size: 28px;
    }

    .modal-content {
        grid-template-columns: 1fr;
    }

    .modal-image {
        height: 300px;
    }
}

@media (max-width: 430px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    .product-image {
        height: 150px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            D&V <span>STORE</span>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="🔎 Найти товар..."
            >
        </div>

    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>D&V STORE</h1>
        <p>
            Техника и электроника по актуальным ценам
        </p>
    </section>

    <div class="categories" id="categories">

        <button class="category active" data-category="all">
            Все товары
        </button>

        <button class="category" data-category="Apple">
            🍎 Apple
        </button>

        <button class="category" data-category="Samsung">
            Samsung
        </button>

        <button class="category" data-category="Xiaomi">
            Xiaomi
        </button>

        <button class="category" data-category="Huawei">
            Huawei
        </button>

        <button class="category" data-category="Google">
            Google
        </button>

        <button class="category" data-category="OnePlus">
            OnePlus
        </button>

        <button class="category" data-category="Poco">
            Poco
        </button>

    </div>

    <section class="products" id="products"></section>

</main>

<footer>
    © 2026 D&V STORE
</footer>

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="close" onclick="closeModal()">×</div>

        <div class="modal-content">

            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>

            <div>

                <div class="modal-title" id="modalName"></div>

                <div class="modal-price" id="modalPrice"></div>

                <div class="modal-row">
                    <div class="modal-label">Бренд</div>
                    <div id="modalBrand"></div>
                </div>

                <div class="modal-row">
                    <div class="modal-label">Память</div>
                    <div id="modalMemory"></div>
                </div>

                <div class="modal-row">
                    <div class="modal-label">Цвет</div>
                    <div id="modalColor"></div>
                </div>

                <div class="modal-row">
                    <div class="modal-label">Наличие</div>
                    <div id="modalAvailable"></div>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

let products = [];

let currentCategory = "all";

const productsContainer =
    document.getElementById("products");

const searchInput =
    document.getElementById("search");


// ==============================
// ЗАГРУЗКА КАТАЛОГА
// ==============================

async function loadProducts() {

    try {

        const response =
            await fetch("products.json?t=" + Date.now());

        if (!response.ok) {
            throw new Error("products.json не найден");
        }

        products = await response.json();

        renderProducts();

    } catch (error) {

        console.error(error);

        productsContainer.innerHTML = `
            <div class="empty">
                <h2>Каталог пока загружается</h2>
                <p>
                    Проверь файл products.json
                </p>
            </div>
        `;
    }
}


// ==============================
// ПОКАЗ ТОВАРОВ
// ==============================

function renderProducts() {

    const search =
        searchInput.value
        .toLowerCase()
        .trim();

    let filtered = products.filter(product => {

        const name =
            (product.name || "").toLowerCase();

        const brand =
            (product.brand || "").toLowerCase();

        const matchesSearch =
            name.includes(search) ||
            brand.includes(search);

        const matchesCategory =
            currentCategory === "all" ||
            brand === currentCategory.toLowerCase();

        return matchesSearch && matchesCategory;

    });


    if (!filtered.length) {

        productsContainer.innerHTML = `
            <div class="empty">
                <h2>Ничего не найдено</h2>
                <p>Попробуй изменить запрос</p>
            </div>
        `;

        return;
    }


    productsContainer.innerHTML =
        filtered.map((product, index) => {

            const image =
                product.image ||
                "https://store77.net/bitrix/templates/v11/img/og-default.png";

            return `

                <article class="product">

                    <div class="product-image">

                        <img
                            src="${image}"
                            alt="${escapeHtml(product.name || "")}"
                            loading="lazy"
                            onerror="this.src='https://store77.net/bitrix/templates/v11/img/og-default.png'"
                        >

                    </div>

                    <div class="product-info">

                        <div class="product-name">
                            ${escapeHtml(product.name || "Товар")}
                        </div>

                        <div class="product-meta">

                            ${product.memory || ""}

                            ${product.color
                                ? " · " + escapeHtml(product.color)
                                : ""}

                        </div>

                        <div class="price">
                            ${escapeHtml(product.price || "Цена уточняется")}
                        </div>

                        <div class="stock">
                            ${product.available
                                ? "● В наличии"
                                : "● Нет в наличии"}
                        </div>

                        <button
                            class="details"
                            onclick="openProduct(${products.indexOf(product)})"
                        >
                            Подробнее
                        </button>

                    </div>

                </article>

            `;

        }).join("");
}


// ==============================
// ОТКРЫТИЕ ТОВАРА
// ==============================

function openProduct(index) {

    const product = products[index];

    if (!product) return;


    document.getElementById("modalImage").src =
        product.image ||
        "https://store77.net/bitrix/templates/v11/img/og-default.png";

    document.getElementById("modalName").textContent =
        product.name || "Товар";

    document.getElementById("modalPrice").textContent =
        product.price || "Цена уточняется";

    document.getElementById("modalBrand").textContent =
        product.brand || "—";

    document.getElementById("modalMemory").textContent =
        product.memory || "—";

    document.getElementById("modalColor").textContent =
        product.color || "—";

    document.getElementById("modalAvailable").textContent =
        product.available
            ? "В наличии"
            : "Нет в наличии";


    document.getElementById("modal")
        .classList.add("active");
}


// ==============================
// ЗАКРЫТИЕ
// ==============================

function closeModal() {

    document.getElementById("modal")
        .classList.remove("active");

}


document.getElementById("modal")
    .addEventListener("click", function(e) {

        if (e.target === this) {
            closeModal();
        }

    });


// ==============================
// ПОИСК
// ==============================

searchInput.addEventListener(
    "input",
    renderProducts
);


// ==============================
// КАТЕГОРИИ
// ==============================

document.querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener("click", () => {

            document
                .querySelectorAll(".category")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            currentCategory =
                button.dataset.category;

            renderProducts();

        });

    });


// ==============================
// ЗАЩИТА HTML
// ==============================

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==============================
// START
// ==============================

loadProducts();

</script>

</body>
</html>
