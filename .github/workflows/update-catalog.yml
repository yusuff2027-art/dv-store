name: Update D&V STORE catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Store77 parser
        run: |
          python parser.py

      - name: Upload Store77 debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store77-debug
          path: |
            store77_debug.html
            store77_links.json
          if-no-files-found: warn

      - name: Save updated catalog
        run: |
          git config user.name "D&V STORE Bot"
          git config user.email "actions@github.com"

          git add products.json

          git diff --cached --quiet || git commit -m "Update Store77 catalog"

          git push
