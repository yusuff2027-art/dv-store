name: Update D&V STORE catalog

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-catalog:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run AppleAvenue scraper
        run: |
          python scraper.py

      - name: Check products.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          file = Path("products.json")

          if not file.exists():
              print("ERROR: products.json не создан")
              raise SystemExit(1)

          products = json.loads(
              file.read_text(encoding="utf-8")
          )

          print(f"Товаров в каталоге: {len(products)}")

          with_images = sum(
              1 for p in products
              if p.get("image")
          )

          with_prices = sum(
              1 for p in products
              if p.get("price")
              and p.get("price") != "Цена уточняется"
          )

          print(f"С фотографиями: {with_images}")
          print(f"С ценами: {with_prices}")
          PY

      - name: Commit updated catalog
        run: |

          git config user.name "D&V STORE Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Изменений нет."

          else

            git commit -m "🔄 Автообновление каталога D&V STORE"

            git push

          fi
